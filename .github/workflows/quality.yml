name: Quality checks
on:
  push:
    branches: [main, deployment/vercel]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm run build
